services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: karenderya_orders
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d karenderya_orders"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
  api:
    build: ./backend
    environment:
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=karenderya_orders;Username=postgres;Password=postgres
    depends_on:
      postgres:
        condition: service_healthy
    ports: ["8080:8080"]
  web:
    build: ./frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8080
    depends_on: [api]
    ports: ["5173:5173"]

volumes:
  postgres_data:
